      <!-- Top Header & Stepper Bar -->
      <div class="aqua-modal-header">
        <div class="aqua-header-title-row">
          <div class="aqua-header-badge">
            <span class="badge-dot"></span>
            <span id="wizard-badge-text" data-i18n-en="NASA SPACE APPS • EXPEDITION ONBOARDING"
              data-i18n-bn="নাসা স্পেস অ্যাপস • মহাকাশ অনবোর্ডিং">NASA SPACE APPS • EXPEDITION ONBOARDING</span>
          </div>
          <div class="aqua-header-actions">
            <button class="aqua-lang-toggle-btn" id="aqua-lang-toggle-btn" type="button"
              onclick="window.toggleWizardLanguage?.()"
              title="Switch Language (English / বাংলা)">
              <span class="lang-flag">🌐</span> <span id="aqua-lang-label">বাংলা (BN)</span>
            </button>
            <button class="aqua-modal-close-btn" id="btn-aqua-modal-close" aria-label="Close Wizard"
              onclick="window.dismissAquaGuidedModal?.()">✕</button>
          </div>
        </div>

        <!-- 4-Step Navigation Stepper (Levels step reached via the hub, not a tab) -->
        <div class="aqua-stepper-bar">
          <button class="aqua-step-node active" id="aqua-step-indicator-1" data-step="1" type="button"
            onclick="window.setAquaStep?.(1)">
            <span class="step-num">1</span>
            <span class="step-name" id="stepper-label-1" data-i18n-en="WELCOME" data-i18n-bn="স্বাগতম">WELCOME</span>
          </button>
          <div class="aqua-step-connector" id="aqua-step-conn-1"></div>
          <button class="aqua-step-node" id="aqua-step-indicator-2" data-step="2" type="button"
            onclick="window.setAquaStep?.(2)">
            <span class="step-num">2</span>
            <span class="step-name" id="stepper-label-2" data-i18n-en="THE STORY" data-i18n-bn="গল্প">THE STORY</span>
          </button>
          <div class="aqua-step-connector" id="aqua-step-conn-2"></div>
          <button class="aqua-step-node" id="aqua-step-indicator-3" data-step="3" type="button"
            onclick="window.setAquaStep?.(3)">
            <span class="step-num">3</span>
            <span class="step-name" id="stepper-label-3" data-i18n-en="VIDEO" data-i18n-bn="ভিডিও">VIDEO</span>
          </button>
          <div class="aqua-step-connector" id="aqua-step-conn-3"></div>
          <button class="aqua-step-node" id="aqua-step-indicator-4" data-step="4" type="button"
            onclick="window.setAquaStep?.(4)">
            <span class="step-num">4</span>
            <span class="step-name" id="stepper-label-4" data-i18n-en="MEET BOTS" data-i18n-bn="বট সঙ্গী">MEET
              BOTS</span>
          </button>
        </div>
      </div>
